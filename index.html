<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GTA 6 IRL Overlay</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    font-family: 'Segoe UI', Arial, sans-serif;
    overflow: hidden;
    width: 1920px;
    height: 1080px;
    color: white;
  }
  .status-bars {
    position: absolute;
    top: 30px;
    left: 30px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .bar-container {
    display: flex;
    align-items: center;
    background: rgba(0,0,0,0.75);
    border-radius: 8px;
    padding: 6px 10px;
    width: 220px;
  }
  .icon { font-size: 18px; margin-right: 10px; width: 24px; text-align: center; }
  .bar-bg {
    flex: 1;
    height: 10px;
    background: #222;
    border-radius: 5px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    transition: width 0.4s ease;
  }
  .health .bar-fill { background: linear-gradient(90deg, #ff4d6d, #ff7aa2); }
  .stamina .bar-fill { background: linear-gradient(90deg, #00e5c7, #5fffe0); }
  .focus .bar-fill { background: linear-gradient(90deg, #a855f7, #c084fc); }
  .top-right {
    position: absolute;
    top: 30px;
    right: 30px;
    text-align: right;
  }
  .money {
    font-size: 32px;
    font-weight: bold;
    color: #4ade80;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  .stars {
    margin: 6px 0;
    font-size: 22px;
    letter-spacing: 4px;
    color: #ccc;
  }
  .live-badge {
    display: inline-block;
    background: #e11d48;
    color: white;
    font-weight: bold;
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 16px;
    margin-top: 4px;
  }
  .minimap-wrap {
    position: absolute;
    bottom: 40px;
    left: 40px;
  }
  .minimap {
    width: 160px;
    height: 160px;
    border-radius: 50%;
    background: #111 url('https://staticmap.openstreetmap.de/staticmap.php?center=38.9536,-94.7336&zoom=15&size=200x200&maptype=mapnik') center/cover;
    border: 4px solid rgba(255,255,255,0.2);
    position: relative;
    box-shadow: 0 0 15px rgba(0,0,0,0.7);
    overflow: hidden;
  }
  .arrow {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 26px;
    color: white;
    text-shadow: 0 0 6px black;
    z-index: 2;
  }
  .north {
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    background: #000;
    color: white;
    font-size: 11px;
    font-weight: bold;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
  }
  .location {
    margin-top: 8px;
    font-size: 14px;
    text-align: center;
    text-shadow: 0 1px 3px black;
  }
  .mission {
    position: absolute;
    bottom: 50px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 2px 6px black;
    background: rgba(0,0,0,0.45);
    padding: 6px 20px;
    border-radius: 8px;
  }
  .weapon {
    position: absolute;
    bottom: 40px;
    right: 40px;
    background: rgba(0,0,0,0.8);
    padding: 10px 14px 12px;
    border-radius: 10px;
    text-align: center;
    min-width: 170px;
  }
  .weapon-icon {
    width: 90px;
    height: 55px;
    margin: 0 auto 2px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .weapon-name { font-size: 14px; font-weight: bold; }
  .weapon-ammo { font-size: 12px; color: #bbb; margin-top: 1px; }

  .controls {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.92);
    padding: 20px;
    border-radius: 12px;
    z-index: 100;
    display: none;
    flex-direction: column;
    gap: 12px;
    min-width: 320px;
    border: 1px solid #333;
  }
  .controls.show { display: flex; }
  .controls h3 { margin-bottom: 4px; font-size: 18px; }
  button {
    background: #333;
    color: white;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #555; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  label { font-size: 13px; color: #ccc; }
</style>
</head>
<body>
  <div class="status-bars">
    <div class="bar-container health">
      <div class="icon">❤️</div>
      <div class="bar-bg"><div class="bar-fill" id="health-fill"></div></div>
    </div>
    <div class="bar-container stamina">
      <div class="icon">⚡</div>
      <div class="bar-bg"><div class="bar-fill" id="stamina-fill"></div></div>
    </div>
    <div class="bar-container focus">
      <div class="icon">👁️</div>
      <div class="bar-bg"><div class="bar-fill" id="focus-fill"></div></div>
    </div>
  </div>

  <div class="top-right">
    <div class="money" id="money">$1,250</div>
    <div class="stars" id="stars">☆☆☆☆☆☆</div>
    <div class="live-badge">● LIVE</div>
  </div>

  <div class="minimap-wrap">
    <div class="minimap">
      <div class="north">N</div>
      <div class="arrow">▲</div>
    </div>
    <div class="location">Lenexa, KS</div>
  </div>

  <div class="mission">Current Mission: IRL Stream</div>

  <div class="weapon">
    <div class="weapon-icon" id="weapon-icon"></div>
    <div class="weapon-name" id="weapon-name"></div>
    <div class="weapon-ammo" id="weapon-ammo"></div>
  </div>

  <div class="controls" id="controls">
    <h3>Streamer Controls</h3>
    <div>
      <strong>Cash</strong>
      <div class="row">
        <button onclick="adjustCash(-1000)">-1000</button>
        <button onclick="adjustCash(-100)">-100</button>
        <button onclick="adjustCash(100)">+100</button>
        <button onclick="adjustCash(1000)">+1000</button>
      </div>
    </div>
    <div>
      <strong>Weapon</strong>
      <div class="row">
        <button onclick="cycleWeapon(-1)">← Prev</button>
        <button onclick="cycleWeapon(1)">Next →</button>
      </div>
    </div>
    <div>
      <label>Stamina: <span id="stamina-val">100</span></label>
      <div class="row">
        <button onclick="setStamina(stamina - 15)">-15</button>
        <button onclick="setStamina(stamina + 20)">+20</button>
        <button onclick="setStamina(100)">Full</button>
      </div>
    </div>
    <div>
      <label>Focus: <span id="focus-val">100</span></label>
      <div class="row">
        <button onclick="setFocus(focus - 15)">-15</button>
        <button onclick="setFocus(focus + 20)">+20</button>
        <button onclick="setFocus(100)">Full</button>
      </div>
    </div>
    <div>
      <strong>Wanted Stars</strong>
      <div class="row">
        <button onclick="setWanted(wanted - 1)">-</button>
        <button onclick="setWanted(wanted + 1)">+</button>
        <button onclick="setWanted(0)">Clear</button>
      </div>
    </div>
    <button onclick="toggleControls()" style="margin-top:8px;">Close (C)</button>
  </div>

<script>
  let cash = 1250;
  let health = 100;
  let stamina = 100;
  let focus = 100;
  let wanted = 0;
  let weaponIndex = 0;

  const weapons = [
    { 
      name: "Fists", 
      ammo: "", 
      icon: `<svg viewBox="0 0 100 60" width="90" height="55"><g fill="#f0f0f0" stroke="#222" stroke-width="0.5"><path d="M22 38c-5 0-9-4-9-9V20c0-3 2-5 5-5h7c1.5 0 3 1.2 3 3v10c0 5-2.5 10-6 10z"/><path d="M32 36V18c0-4 3-6 6-6h5c3 0 6 2.5 6 6v14c0 3-1.5 5-4 6.5l-5 2.5c-2.5 1-5 0-6-2.5z"/><path d="M48 34V16c0-3 2.5-5 5-5h6c2.5 0 5 2 5 5v16c0 4-3 7-6.5 7H52c-2.5 0-4-2-4-4.5z"/><path d="M64 32V14c0-4 3-6 6-6h4c3 0 6 2.5 6 6v18c0 5-4 8-8 8h-3c-3 0-5-2.5-5-5z"/></g></svg>`
    },
    { 
      name: "Knife", 
      ammo: "", 
      icon: `<svg viewBox="0 0 100 60" width="90" height="55"><path fill="#e8e8e8" d="M15 38 L55 12 L62 20 L22 46 Z"/><rect fill="#6a6a6a" x="18" y="40" width="10" height="16" rx="1"/></svg>`
    },
    { 
      name: "Glock", 
      ammo: "17 / 68", 
      icon: `<svg viewBox="0 0 100 60" width="90" height="55"><rect fill="#c8c8c8" x="20" y="26" width="48" height="7" rx="1"/><rect fill="#888" x="60" y="23" width="16" height="13" rx="1"/><rect fill="#555" x="32" y="33" width="9" height="16"/></svg>`
    },
    { 
      name: "Highpoint", 
      ammo: "8 / 24", 
      icon: `<svg viewBox="0 0 100 60" width="90" height="55"><rect fill="#b0b0b0" x="18" y="24" width="52" height="9" rx="1"/><rect fill="#666" x="62" y="21" width="14" height="15"/><rect fill="#444" x="34" y="33" width="11" height="18"/></svg>`
    },
    { 
      name: "Draco", 
      ammo: "30 / 90", 
      icon: `<svg viewBox="0 0 100 60" width="90" height="55"><rect fill="#d0d0d0" x="12" y="24" width="58" height="8" rx="1"/><rect fill="#777" x="62" y="21" width="18" height="14"/><rect fill="#555" x="26" y="32" width="7" height="20"/><rect fill="#444" x="40" y="32" width="22" height="6"/></svg>`
    },
    { 
      name: "Phone", 
      ammo: "Streaming", 
      icon: `<svg viewBox="0 0 100 60" width="90" height="55"><rect fill="#222" x="32" y="6" width="36" height="48" rx="4"/><rect fill="#111" x="35" y="12" width="30" height="34"/><circle fill="#333" cx="50" cy="48" r="2.5"/></svg>`
    }
  ];

  function updateMoney() {
    document.getElementById('money').textContent = '$' + cash.toLocaleString();
  }

  function adjustCash(amount) {
    cash = Math.max(0, cash + amount);
    updateMoney();
  }

  function setHealth(percent) {
    health = Math.max(0, Math.min(100, percent));
    document.getElementById('health-fill').style.width = health + '%';
  }

  function setStamina(percent) {
    stamina = Math.max(0, Math.min(100, percent));
    document.getElementById('stamina-fill').style.width = stamina + '%';
    document.getElementById('stamina-val').textContent = Math.round(stamina);
  }

  function setFocus(percent) {
    focus = Math.max(0, Math.min(100, percent));
    document.getElementById('focus-fill').style.width = focus + '%';
    document.getElementById('focus-val').textContent = Math.round(focus);
  }

  function setWanted(level) {
    wanted = Math.max(0, Math.min(6, level));
    const filled = '★'.repeat(wanted);
    const empty = '☆'.repeat(6 - wanted);
    document.getElementById('stars').textContent = filled + empty;
  }

  function cycleWeapon(dir) {
    weaponIndex = (weaponIndex + dir + weapons.length) % weapons.length;
    updateWeaponDisplay();
  }

  function updateWeaponDisplay() {
    const w = weapons[weaponIndex];
    document.getElementById('weapon-icon').innerHTML = w.icon;
    document.getElementById('weapon-name').textContent = w.name;
    document.getElementById('weapon-ammo').textContent = w.ammo;
  }

  function toggleControls() {
    document.getElementById('controls').classList.toggle('show');
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'c' || e.key === 'C') toggleControls();
    if (e.key === 'ArrowRight') cycleWeapon(1);
    if (e.key === 'ArrowLeft') cycleWeapon(-1);
    if (e.key === '+') adjustCash(100);
    if (e.key === '-') adjustCash(-100);
    if (e.key === 's') setStamina(stamina - 10);
    if (e.key === 'S') setStamina(stamina + 10);
    if (e.key === 'f') setFocus(focus - 10);
    if (e.key === 'F') setFocus(focus + 10);
  });

  async function initBattery() {
    if ('getBattery' in navigator) {
      try {
        const battery = await navigator.getBattery();
        const update = () => setHealth(Math.round(battery.level * 100));
        update();
        battery.addEventListener('levelchange', update);
      } catch (e) {}
    }
  }

  setInterval(() => {
    if (stamina > 15) setStamina(stamina - 0.3);
  }, 2500);

  updateMoney();
  setHealth(100);
  setStamina(100);
  setFocus(100);
  setWanted(0);
  updateWeaponDisplay();
  initBattery();
</script>
</body>
</html>
